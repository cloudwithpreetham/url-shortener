name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------- CI: Lint + Test ----------
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: pytest backend -v

  # ---------- CI: Build Docker image ----------
  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image (no push, PR/branch validation)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: url-shortener:backend-ci

      - name: Build frontend image (no push, PR/branch validation)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: url-shortener:frontend-ci

  # ---------- CD: Push to Docker Hub on main ----------
  push-image:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:backend-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:backend-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:frontend-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:frontend-${{ github.sha }}

  # ---------- CD: Deploy to Kubernetes ----------
  deploy:
    needs: push-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ap-south-1 --name url-shortener

      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
          kubectl wait --namespace cert-manager \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/instance=cert-manager \
            --timeout=180s

      - name: Install ingress-nginx controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/aws/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      - name: Create Kubernetes secrets
        run: |
          kubectl create secret generic redis-secret \
            --from-literal=password="${{ secrets.REDIS_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic grafana-admin \
            --from-literal=password="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to cluster
        run: |
          kubectl apply -f k8s/redis/
          kubectl apply -f k8s/tls/
          kubectl apply -f k8s/app/
          kubectl apply -f k8s/observability/
          kubectl set image deployment/url-shortener \
            url-shortener=${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:backend-${{ github.sha }} \
            --namespace=default
          kubectl set image deployment/url-shortener-frontend \
            url-shortener-frontend=${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:frontend-${{ github.sha }} \
            --namespace=default
          kubectl rollout status deployment/url-shortener --namespace=default
          kubectl rollout status deployment/url-shortener-frontend --namespace=default
