server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API routes to the backend, for docker-compose only.
    # In Kubernetes these paths are intercepted by the Ingress before
    # reaching this container, so this block is never actually hit there.
    #
    # Using a variable in proxy_pass (instead of a bare hostname) defers
    # DNS resolution to request time via the resolver directive below,
    # instead of at nginx startup. This matters because nginx normally
    # validates every proxy_pass hostname at boot and refuses to start
    # if any of them don't resolve -- which would crash this container
    # in Kubernetes, where no "backend" hostname exists at all.
    resolver 127.0.0.11 valid=10s;
    location ~ ^/(health|shorten|stats/) {
        set $backend_upstream "backend:5000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
