server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API routes to the backend.
    # In docker-compose this resolves via the "backend" service name.
    # In Kubernetes these paths are intercepted by the Ingress before
    # reaching this container, so this block is effectively unused there.
    location ~ ^/(health|shorten|stats/) {
        proxy_pass http://backend:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
