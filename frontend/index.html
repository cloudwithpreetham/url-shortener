<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 480px;
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      background: #6366f1;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #4f46e5; }
    #result {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #0f172a;
      border-radius: 8px;
      display: none;
      word-break: break-all;
    }
    #result a { color: #818cf8; }
    .error { color: #f87171; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔗 URL Shortener</h1>
    <input type="text" id="longUrl" placeholder="Paste a long URL here..." />
    <button onclick="shortenUrl()">Shorten</button>
    <div id="result"></div>
    <div id="error" class="error"></div>
  </div>

  <script>
    const API_BASE = window.API_BASE_URL || "";

    async function shortenUrl() {
      const input = document.getElementById("longUrl");
      const resultDiv = document.getElementById("result");
      const errorDiv = document.getElementById("error");
      resultDiv.style.display = "none";
      errorDiv.textContent = "";

      const url = input.value.trim();
      if (!url) {
        errorDiv.textContent = "Please enter a URL.";
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/shorten`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (!res.ok) {
          errorDiv.textContent = data.error || "Something went wrong.";
          return;
        }

        resultDiv.style.display = "block";
        resultDiv.innerHTML = `Short URL: <a href="${data.short_url}" target="_blank">${data.short_url}</a>`;
      } catch (err) {
        errorDiv.textContent = "Could not reach the server.";
      }
    }
  </script>
</body>
</html>
