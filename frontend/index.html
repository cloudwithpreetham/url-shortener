<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>route/ — URL Shortener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0e2c4d;
      --bg-2: #123761;
      --grid: rgba(255, 255, 255, 0.055);
      --grid-strong: rgba(255, 255, 255, 0.1);
      --cyan: #7fe0d8;
      --amber: #ffb648;
      --amber-dark: #e0972f;
      --paper: #eef4f8;
      --paper-2: #dde8ef;
      --ink: #0e2c4d;
      --ink-soft: #4c6178;
      --ink-faint: #8098ac;
      --white: #ffffff;
      --danger: #ff6b5e;
      --danger-deep: #d94f42;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        linear-gradient(var(--grid-strong) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
        radial-gradient(ellipse 900px 560px at 50% 0%, var(--bg-2), transparent 70%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, auto;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 1000px 700px at 50% 40%, transparent 45%, var(--bg) 92%);
    }

    .crop {
      position: fixed;
      width: 18px;
      height: 18px;
      z-index: 1;
      pointer-events: none;
      opacity: 0.35;
    }

    .crop::before,
    .crop::after {
      content: "";
      position: absolute;
      background: var(--white);
    }

    .crop::before {
      width: 100%;
      height: 1px;
      top: 50%;
    }

    .crop::after {
      width: 1px;
      height: 100%;
      left: 50%;
    }

    .crop-tl {
      top: 20px;
      left: 20px;
    }

    .crop-tr {
      top: 20px;
      right: 20px;
    }

    .crop-bl {
      bottom: 20px;
      left: 20px;
    }

    .crop-br {
      bottom: 20px;
      right: 20px;
    }

    a {
      color: inherit;
    }

    .topbar {
      position: relative;
      z-index: 2;
      padding: 30px 44px 0;
    }

    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.01em;
    }

    .wordmark .slash {
      color: var(--amber);
    }

    .status-tag {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 11px;
      border-radius: 5px;
      color: #a9bcce;
    }

    .status-tag .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 0 3px rgba(127, 224, 216, 0.25);
    }

    .stage {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 24px 40px;
    }

    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 11.5px;
      letter-spacing: 0.16em;
      color: var(--cyan);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 20px;
      height: 1px;
      background: rgba(127, 224, 216, 0.4);
    }

    h1 {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: clamp(26px, 4.4vw, 40px);
      line-height: 1.28;
      letter-spacing: -0.01em;
      text-align: center;
      margin: 0 0 40px;
      max-width: 620px;
    }

    .panel {
      width: 100%;
      max-width: 560px;
      background: var(--paper);
      border-radius: 4px;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.6) inset,
        0 20px 50px -20px rgba(0, 0, 0, 0.5),
        0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 26px 26px 22px;
      position: relative;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px dashed rgba(14, 44, 77, 0.14);
      margin: 8px;
      pointer-events: none;
      border-radius: 2px;
    }

    .field-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 9px;
    }

    .field-label .tick {
      color: var(--amber-dark);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .field-box {
      flex: 1;
      min-width: 0;
      position: relative;
      background: var(--white);
      border: 1.5px solid var(--paper-2);
      border-radius: 4px;
      transition: border-color 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out);
    }

    input#longUrl {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      padding: 13px 14px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--ink);
    }

    input#longUrl::placeholder {
      color: #9fb0bf;
    }

    .field-box:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(127, 224, 216, 0.28);
    }

    .field-box.invalid {
      border-color: var(--danger);
      animation: shake 0.32s var(--ease-out);
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }
    }

    button#shortenBtn {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--amber);
      color: var(--ink);
      border: none;
      border-radius: 4px;
      padding: 0 18px;
      font-family: 'Space Mono', monospace;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background 0.16s var(--ease-out), transform 0.12s var(--ease-out);
      white-space: nowrap;
    }

    button#shortenBtn:hover:not(:disabled) {
      background: var(--amber-dark);
    }

    button#shortenBtn:active:not(:disabled) {
      transform: scale(0.97);
    }

    button#shortenBtn:disabled {
      opacity: 0.7;
      cursor: default;
    }

    button#shortenBtn:focus-visible {
      outline: 2.5px solid var(--cyan);
      outline-offset: 2px;
    }

    .icon-btn:focus-visible {
      outline: 2.5px solid var(--cyan);
      outline-offset: 2px;
    }

    .btn-arrow {
      display: inline-block;
      transition: transform 0.4s var(--ease-spring);
    }

    button#shortenBtn.loading .btn-arrow {
      animation: arrowSpin 0.8s linear infinite;
    }

    @keyframes arrowSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .hint {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--ink-faint);
      padding: 10px 2px 0;
      min-height: 16px;
    }

    .hint.error-text {
      color: var(--danger-deep);
      font-weight: 700;
    }

    .dim {
      display: none;
      align-items: center;
      gap: 10px;
      margin: 16px 2px 0;
    }

    .dim.show {
      display: flex;
      animation: fadeUp 0.4s var(--ease-out);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dim-num {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .dim-num.accent {
      color: var(--amber-dark);
      font-weight: 700;
    }

    .dim-track {
      flex: 1;
      position: relative;
      height: 2px;
      background: var(--paper-2);
    }

    .dim-track::before,
    .dim-track::after {
      content: "";
      position: absolute;
      top: -4px;
      width: 1px;
      height: 10px;
      background: var(--paper-2);
    }

    .dim-track::before {
      left: 0;
    }

    .dim-track::after {
      right: 0;
    }

    .dim-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: var(--amber);
      transition: width 0.6s var(--ease-out);
    }

    .dim-pct {
      display: none;
      font-family: 'Space Mono', monospace;
      font-size: 10.5px;
      color: var(--ink-faint);
      text-align: right;
      margin: 5px 2px 0;
    }

    .dim-pct.show {
      display: block;
    }

    .result {
      display: none;
      margin-top: 16px;
      background: var(--white);
      border-left: 3px solid var(--amber);
      border-radius: 0 4px 4px 0;
      padding: 14px 16px;
    }

    .result.show {
      display: block;
      animation: fadeUp 0.4s var(--ease-out);
    }

    .result-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .result-url {
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 4px;
      border: 1px solid var(--paper-2);
      background: var(--paper);
      color: var(--ink-soft);
      cursor: pointer;
      transition: background 0.15s var(--ease-out), color 0.15s var(--ease-out), border-color 0.15s var(--ease-out);
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
    }

    .icon-btn:hover {
      background: #e4edf3;
      color: var(--ink);
    }

    .icon-btn.copied {
      background: var(--cyan);
      border-color: var(--cyan);
      color: var(--ink);
    }

    .result-dest {
      margin-top: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      color: var(--ink-faint);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-dest .arrow {
      color: var(--ink-faint);
      margin-right: 5px;
    }

    .error {
      display: none;
      margin-top: 16px;
      background: #fff2f0;
      border-left: 3px solid var(--danger);
      border-radius: 0 4px 4px 0;
      padding: 12px 16px;
    }

    .error.show {
      display: flex;
      align-items: center;
      gap: 9px;
      animation: fadeUp 0.35s var(--ease-out);
    }

    .error svg {
      width: 15px;
      height: 15px;
      color: var(--danger-deep);
      flex-shrink: 0;
    }

    .error span {
      font-family: 'Space Mono', monospace;
      font-size: 11.5px;
      color: var(--danger-deep);
      font-weight: 700;
    }

    .foot {
      position: relative;
      z-index: 2;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
      padding: 0 24px 30px;
    }

    @media (max-width: 560px) {
      .topbar {
        padding: 22px 20px 0;
      }

      .stage {
        padding: 44px 16px 30px;
      }

      .panel {
        padding: 22px 18px 18px;
      }

      .input-row {
        flex-direction: column;
      }

      button#shortenBtn {
        padding: 13px 18px;
        justify-content: center;
      }

      .result-top {
        flex-wrap: wrap;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="grid-bg"></div>
  <div class="vignette"></div>
  <div class="crop crop-tl"></div>
  <div class="crop crop-tr"></div>
  <div class="crop crop-bl"></div>
  <div class="crop crop-br"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="wordmark">route<span class="slash">/</span></div>
      <div class="status-tag"><span class="dot"></span>self-hosted · live</div>
    </div>
  </header>

  <main class="stage">
    <div class="eyebrow">URL SHORTENER</div>
    <h1>Paste a long URL.<br>Get a short route back.</h1>

    <div class="panel">
      <div class="field-label"><span class="tick">›</span> LONG URL</div>
      <div class="input-row">
        <div class="field-box" id="fieldBox">
          <input type="text" id="longUrl" placeholder="https://example.com/a/very/long/path?with=params"
            autocomplete="off" autofocus />
        </div>
        <button id="shortenBtn" type="button">
          <span class="btn-arrow" id="btnArrow">→</span>
          <span id="btnLabel">Route it</span>
        </button>
      </div>
      <div class="hint" id="hint">Press Enter, or click Route it.</div>

      <div class="dim" id="dimRow">
        <span class="dim-num" id="dimLong">— chars</span>
        <span class="dim-track"><span class="dim-fill" id="dimFill"></span></span>
        <span class="dim-num accent" id="dimShort">— chars</span>
      </div>
      <div class="dim-pct" id="dimPct"></div>

      <div class="result" id="result">
        <div class="result-top">
          <div class="result-url" id="codeText"></div>
          <div class="result-actions">
            <button class="icon-btn" id="copyBtn" type="button" title="Copy short link" aria-label="Copy short link">
              <svg id="copyIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
              <svg id="checkIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </button>
            <a class="icon-btn" id="openBtn" href="#" target="_blank" rel="noopener" title="Open short link"
              aria-label="Open short link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                <polyline points="15 3 21 3 21 9" />
                <line x1="10" y1="14" x2="21" y2="3" />
              </svg>
            </a>
          </div>
        </div>
        <div class="result-dest"><span class="arrow">↳</span><span id="destText"></span></div>
      </div>

      <div class="error" id="error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span id="errorText">Route rejected.</span>
      </div>
    </div>
  </main>

  <footer class="foot">NO ACCOUNT REQUIRED · LINKS DON'T EXPIRE</footer>

  <script>
    const API_BASE = window.API_BASE_URL || "";

    const input = document.getElementById("longUrl");
    const fieldBox = document.getElementById("fieldBox");
    const btn = document.getElementById("shortenBtn");
    const btnLabel = document.getElementById("btnLabel");
    const hint = document.getElementById("hint");
    const dimRow = document.getElementById("dimRow");
    const dimLong = document.getElementById("dimLong");
    const dimShort = document.getElementById("dimShort");
    const dimFill = document.getElementById("dimFill");
    const dimPct = document.getElementById("dimPct");
    const result = document.getElementById("result");
    const errorBox = document.getElementById("error");
    const errorText = document.getElementById("errorText");
    const codeText = document.getElementById("codeText");
    const destText = document.getElementById("destText");
    const copyBtn = document.getElementById("copyBtn");
    const copyIcon = document.getElementById("copyIcon");
    const checkIcon = document.getElementById("checkIcon");
    const openBtn = document.getElementById("openBtn");

    let currentShortUrl = "";

    function resetHint() {
      hint.textContent = "Press Enter, or click Route it.";
      hint.classList.remove("error-text");
      fieldBox.classList.remove("invalid");
    }

    function showError(message) {
      result.classList.remove("show");
      dimRow.classList.remove("show");
      dimPct.classList.remove("show");
      errorBox.classList.remove("show");
      void errorBox.offsetWidth;
      errorBox.classList.add("show");
      errorText.textContent = message;
    }

    function showResult(data) {
      errorBox.classList.remove("show");

      codeText.textContent = data.short_url;
      destText.textContent = data.long_url;
      currentShortUrl = data.short_url;
      openBtn.href = data.short_url;

      result.classList.remove("show");
      void result.offsetWidth;
      result.classList.add("show");

      const longLen = data.long_url.length;
      const shortLen = data.short_url.length;
      const pct = longLen > 0 ? Math.round((1 - shortLen / longLen) * 100) : 0;

      dimLong.textContent = `${longLen} chars`;
      dimShort.textContent = `${shortLen} chars`;
      dimFill.style.width = "0%";
      dimRow.classList.add("show");
      requestAnimationFrame(() => {
        const ratio = longLen > 0 ? Math.min(100, (shortLen / longLen) * 100) : 0;
        dimFill.style.width = ratio + "%";
      });
      dimPct.textContent = pct > 0 ? `${pct}% shorter` : "same length";
      dimPct.classList.add("show");
    }

    async function shortenUrl() {
      const url = input.value.trim();
      resetHint();

      if (!url) {
        hint.textContent = "Paste a URL first — nothing to route yet.";
        hint.classList.add("error-text");
        fieldBox.classList.add("invalid");
        input.focus();
        return;
      }

      btn.disabled = true;
      btn.classList.add("loading");
      btnLabel.textContent = "Routing…";

      try {
        const res = await fetch(`${API_BASE}/shorten`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || "That URL was rejected.");
        } else {
          showResult(data);
          hint.textContent = "Route created. Copy it or open it now.";
        }
      } catch (err) {
        showError("Could not reach the server.");
      } finally {
        btn.disabled = false;
        btn.classList.remove("loading");
        btnLabel.textContent = "Route it";
      }
    }

    btn.addEventListener("click", shortenUrl);

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") shortenUrl();
    });

    input.addEventListener("input", () => {
      if (fieldBox.classList.contains("invalid")) resetHint();
    });

    copyBtn.addEventListener("click", async () => {
      if (!currentShortUrl) return;
      try {
        await navigator.clipboard.writeText(currentShortUrl);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = currentShortUrl;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      copyIcon.style.display = "none";
      checkIcon.style.display = "block";
      copyBtn.classList.add("copied");
      setTimeout(() => {
        copyIcon.style.display = "block";
        checkIcon.style.display = "none";
        copyBtn.classList.remove("copied");
      }, 1400);
    });
  </script>
</body>

</html>
